[project]
name = "tenderai"
version = "0.1.0"
description = "Baseline technical matching of infusion-pump SKUs against procurement requirements."
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-docx>=1.1",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tenderai = "tenderai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
